version: "3.8"
services:
  db:
    image: postgres:16
    container_name: linglet_db
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: linglet
    ports:
      - "5432:5432"
    volumes:
      - linglet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linglet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  linglet_pg_data:
