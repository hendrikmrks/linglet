name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ─── Build ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/${{ secrets.DB_NAME }}?schema=public
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next/
            node_modules/
            prisma/
            public/
            package.json
            next.config.js
            seed-production-complete.js
            seed-production.js
            seed-all-pt-de.js
            seed-de-pt-chapter1-grundlagen.js
            seed-de-pt-chapter2-alltag.js
            seed-de-pt-chapter3-zu-hause.js
            seed-de-pt-chapter4-freizeit.js
            seed-portuguese-german.js
            seed-pt-de-chapter1-fundamentos.js
            seed-pt-de-chapter2-dia-a-dia.js
            seed-pt-de-chapter3-casa.js
            seed-pt-de-chapter4-lazer.js
            test-pipeline.js
            production-health-check.js
          retention-days: 1

      - name: Build summary
        run: |
          echo "## :hammer_and_wrench: Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Node.js** | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | :white_check_mark: Success |" >> $GITHUB_STEP_SUMMARY

  # ─── Test ───────────────────────────────────────────────────────────
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}?schema=public
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build application
        run: npm run build

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: node seed-production-complete.js

      - name: Start application
        run: npm start &

      - name: Wait for application to be ready
        run: |
          echo "Waiting for app on port 3000..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -qE "200|302"; then
              echo "App is ready!"
              exit 0
            fi
            echo "Attempt $i/30 — not ready yet..."
            sleep 2
          done
          echo "App did not start in time"
          exit 1

      - name: Run test pipeline
        run: node test-pipeline.js http://localhost:3000

      - name: Run health check
        run: node production-health-check.js

      - name: Test summary
        if: always()
        run: |
          echo "## :test_tube: Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Database migration** | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Database seeding** | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Application startup** | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Test pipeline** | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health check** | :white_check_mark: Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Tested against commit \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy ────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted

    env:
      DATABASE_URL: postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}?schema=public
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NODE_ENV: production
      PORT: "3000"

    steps:
      - name: Set deploy directory
        run: echo "DEPLOY_DIR=$HOME/linglet-deploy" >> $GITHUB_ENV

      - name: Prepare deploy directory
        run: mkdir -p $HOME/linglet-deploy

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ github.workspace }}/artifact-tmp

      - name: Copy artifacts to deploy directory
        run: rsync -a --delete ${{ github.workspace }}/artifact-tmp/ $DEPLOY_DIR/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pm2
        run: npm install -g pm2 prisma

      - name: Run Prisma migrations
        working-directory: ${{ env.DEPLOY_DIR }}
        run: npx prisma migrate deploy

      - name: Seed database (skip if already seeded)
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          CHAPTER_COUNT=$(node -e "
            const { Client } = require('pg');
            const c = new Client({ connectionString: process.env.DATABASE_URL });
            c.connect().then(() => c.query('SELECT COUNT(*) FROM \"Chapter\"'))
              .then(r => { console.log(r.rows[0].count); c.end(); })
              .catch(() => { console.log('0'); c.end(); });
          ")
          if [ "$CHAPTER_COUNT" -gt "0" ]; then
            echo "✅ Database already seeded ($CHAPTER_COUNT chapters). Skipping."
          else
            echo "🌱 Seeding database..."
            node seed-production-complete.js
          fi

      - name: Stop previous instance
        run: |
          if pm2 describe linglet > /dev/null 2>&1; then
            pm2 stop linglet
            pm2 delete linglet
          fi

      - name: Create pm2 ecosystem file
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          cat > ecosystem.config.js <<EOF
          module.exports = {
            apps: [{
              name: 'linglet',
              script: 'node_modules/.bin/next',
              args: 'start -p 3000',
              cwd: '$DEPLOY_DIR',
              env: {
                NODE_ENV: 'production',
                PORT: '3000',
                DATABASE_URL: '$DATABASE_URL',
                AUTH_SECRET: '$AUTH_SECRET',
                NEXT_PUBLIC_APP_URL: '$NEXT_PUBLIC_APP_URL',
              }
            }]
          };
          EOF

      - name: Start application
        working-directory: ${{ env.DEPLOY_DIR }}
        run: pm2 start ecosystem.config.js

      - name: Check pm2 logs
        if: always()
        run: sleep 5 && pm2 logs linglet --lines 20 --nostream

      - name: Wait for application to be ready
        run: |
          echo "Waiting for app on port 3000..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -qE "200|302"; then
              echo "App is ready!"
              exit 0
            fi
            echo "Attempt $i/30 — not ready yet..."
            sleep 2
          done
          echo "App did not start in time"
          exit 1

      - name: Run health check
        working-directory: ${{ env.DEPLOY_DIR }}
        run: node production-health-check.js

      - name: Deploy summary
        if: always()
        run: |
          echo "## :rocket: Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production (self-hosted) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **App URL** | ${{ secrets.NEXT_PUBLIC_APP_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Port** | 3000 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Process manager** | pm2 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if pm2 describe linglet > /dev/null 2>&1; then
            echo ":white_check_mark: **Application is running**" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: **Application failed to start **" >> $GITHUB_STEP_SUMMARY
          fi
