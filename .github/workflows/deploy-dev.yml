name: Deploy to Beta

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to beta.linglet.de
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: linglet.de
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ADMIN_PASSWORD
          script: |
            set -e
            cd /opt/linglet/dev

            echo "==> Pulling latest code"
            git pull origin dev

            echo "==> Ensuring linglet_dev accessible via 127.0.0.1"
            PG_VER=$(ls /etc/postgresql/ 2>/dev/null | sort -V | tail -1)
            echo "PostgreSQL version detected: $PG_VER"
            if [ -n "$PG_VER" ]; then
              PG_HBA="/etc/postgresql/$PG_VER/main/pg_hba.conf"
              echo "pg_hba.conf path: $PG_HBA"
              echo "Current linglet entries in pg_hba.conf:"
              grep -n "linglet" "$PG_HBA" 2>/dev/null || echo "(none found)"
              # Always append rule (duplicate is harmless, first match wins)
              echo "host    linglet_dev     linglet         127.0.0.1/32            scram-sha-256" >> "$PG_HBA"
              echo "Reloading PostgreSQL..."
              pg_ctlcluster $PG_VER main reload 2>&1 && echo "Reloaded via pg_ctlcluster" || \
                systemctl reload postgresql 2>&1 && echo "Reloaded via systemctl" || \
                echo "WARNING: Could not reload PostgreSQL"
            else
              echo "WARNING: Could not detect PostgreSQL installation"
              ls /etc/postgresql/ 2>&1 || true
            fi
            DB_URL=$(grep ^DATABASE_URL .env | cut -d= -f2- | sed 's/host\.docker\.internal/127.0.0.1/')
            echo "DB host: $(echo "$DB_URL" | grep -oP '(?<=@)[^:/]+')"
            echo "DB name: $(echo "$DB_URL" | grep -oP '[^/]+$')"

            echo "==> Testing DB connection directly (psql from host)"
            PG_PASS=$(python3 -c "import sys,urllib.parse; url=urllib.parse.urlparse('$DB_URL'); print(urllib.parse.unquote(url.password or ''))")
            PG_USER=$(python3 -c "import sys,urllib.parse; url=urllib.parse.urlparse('$DB_URL'); print(url.username or '')")
            PG_DB=$(python3 -c "import sys,urllib.parse; url=urllib.parse.urlparse('$DB_URL'); print(url.path.lstrip('/'))")
            PGPASSWORD="$PG_PASS" psql -h 127.0.0.1 -U "$PG_USER" -d "$PG_DB" -c "SELECT 1;" 2>&1 && echo "Direct psql OK" || echo "Direct psql FAILED (P1000 expected source)"

            echo "==> Building image"
            docker compose -f docker-compose.dev.yml build --no-cache

            echo "==> Running migrations"
            docker run --rm --network host \
              -e DATABASE_URL="$DB_URL" \
              linglet-dev prisma migrate deploy

            echo "==> Running seeds (dev - fresh each deploy)"
            docker run --rm --network host \
              --env-file .env \
              -e DATABASE_URL="$DB_URL" \
              -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
              linglet-dev node scripts/seed-runner.js --env dev

            echo "==> Starting container"
            docker compose -f docker-compose.dev.yml up -d

            echo "==> Cleaning up old images"
            docker image prune -f

            echo "==> Waiting for health check"
            sleep 10
            curl -sf http://localhost:3001/api/health || (echo "Health check failed!" && exit 1)

            echo "==> Beta deployment complete"
