name: Deploy to Beta

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to beta.linglet.de
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: linglet.de
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ADMIN_PASSWORD
          script: |
            set -e
            cd /opt/linglet/dev

            echo "==> Pulling latest code"
            git pull origin dev

            echo "==> Ensuring linglet_dev accessible via 127.0.0.1"
            PG_VER=$(ls /etc/postgresql/ 2>/dev/null | head -1)
            if [ -n "$PG_VER" ]; then
              PG_HBA="/etc/postgresql/$PG_VER/main/pg_hba.conf"
              if ! grep -q "linglet_dev.*linglet.*127.0.0.1" "$PG_HBA" 2>/dev/null; then
                echo "host    linglet_dev     linglet         127.0.0.1/32            scram-sha-256" >> "$PG_HBA"
                pg_ctlcluster $PG_VER main reload 2>/dev/null || systemctl reload postgresql 2>/dev/null || true
                echo "pg_hba.conf updated and PostgreSQL reloaded"
              fi
            fi
            DB_URL=$(grep ^DATABASE_URL .env | cut -d= -f2- | sed 's/host\.docker\.internal/127.0.0.1/')

            echo "==> Building image"
            docker compose -f docker-compose.dev.yml build --no-cache

            echo "==> Running migrations"
            docker run --rm --network host \
              -e DATABASE_URL="$DB_URL" \
              linglet-dev prisma migrate deploy

            echo "==> Running seeds (dev - fresh each deploy)"
            docker run --rm --network host \
              --env-file .env \
              -e DATABASE_URL="$DB_URL" \
              -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
              linglet-dev node scripts/seed-runner.js --env dev

            echo "==> Starting container"
            docker compose -f docker-compose.dev.yml up -d

            echo "==> Cleaning up old images"
            docker image prune -f

            echo "==> Waiting for health check"
            sleep 10
            curl -sf http://localhost:3001/api/health || (echo "Health check failed!" && exit 1)

            echo "==> Beta deployment complete"
