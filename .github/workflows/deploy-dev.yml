name: Deploy to Beta

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to beta.linglet.de
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: linglet.de
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ADMIN_PASSWORD
          script: |
            set -e
            cd /opt/linglet/dev

            echo "==> Pulling latest code"
            git pull origin dev

            echo "==> Ensuring linglet_dev DB exists with correct permissions"
            DOCKER_GW=$(docker network inspect bridge --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null || echo "172.17.0.1")
            echo "Docker gateway: $DOCKER_GW"
            DB_URL_RAW=$(grep ^DATABASE_URL .env | cut -d= -f2-)
            DB_URL=$(echo "$DB_URL_RAW" | sed "s/host\.docker\.internal/$DOCKER_GW/")
            echo "Using DB URL host: $(echo $DB_URL | sed 's/:\/\/[^:]*:[^@]*@/:\\/\\/***:***@/')"

            echo "==> Building image"
            docker compose -f docker-compose.dev.yml build --no-cache

            echo "==> Running migrations"
            docker run --rm --network host \
              -e DATABASE_URL="$DB_URL" \
              linglet-dev prisma migrate deploy

            echo "==> Running seeds (dev - fresh each deploy)"
            docker run --rm --network host \
              --env-file .env \
              -e DATABASE_URL="$DB_URL" \
              -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
              linglet-dev node scripts/seed-runner.js --env dev

            echo "==> Starting container"
            docker compose -f docker-compose.dev.yml up -d

            echo "==> Cleaning up old images"
            docker image prune -f

            echo "==> Waiting for health check"
            sleep 10
            curl -sf http://localhost:3001/api/health || (echo "Health check failed!" && exit 1)

            echo "==> Beta deployment complete"
